{% extends "layout.html" %}

{% block title %}Setup - Staggs Hectic Trader{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5 col-sm-10">
        <div class="card shadow-lg border-gold">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-rocket fa-3x text-gold mb-3"></i>
                    <h3 class="card-title text-gold">Initial Setup</h3>
                    <p class="text-muted">Create your admin account to secure the bot.</p>
                </div>

                {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
                {% endif %}

                <form method="post">
                    <div class="form-floating mb-3">
                        <input type="text" name="username" class="form-control" id="username" value="admin" placeholder="Username" required>
                        <label for="username">Username</label>
                    </div>
                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
                        <label for="password">Password</label>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">Create Account</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
